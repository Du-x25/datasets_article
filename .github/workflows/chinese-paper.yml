name: Chinese paper PDF

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compile:
    name: Compile and check bilingual Data Descriptor PDFs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install TeX Live and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-lang-chinese \
            texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check environment and source
        run: |
          python scripts/check_environment.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/check_repository.py
          python scripts/check_tex_structure.py

      - name: Compile Chinese, English, and Supplementary PDFs
        run: |
          mkdir -p build/zh build/en
          latexmk -norc -xelatex -bibtex -interaction=nonstopmode \
            -halt-on-error -file-line-error -outdir=build/zh main_zh.tex \
            2>&1 | tee build/zh/latexmk_main.log
          latexmk -norc -xelatex -bibtex -interaction=nonstopmode \
            -halt-on-error -file-line-error -outdir=build/zh supplementary_zh.tex \
            2>&1 | tee build/zh/latexmk_supp.log
          latexmk -norc -xelatex -bibtex -interaction=nonstopmode \
            -halt-on-error -file-line-error -outdir=build/en main_en.tex \
            2>&1 | tee build/en/latexmk_main.log
          latexmk -norc -xelatex -bibtex -interaction=nonstopmode \
            -halt-on-error -file-line-error -outdir=build/en supplementary_en.tex \
            2>&1 | tee build/en/latexmk_supp.log

      - name: Check references, layout, Scientific Data limits, and evidence
        run: |
          python scripts/qa_manuscripts.py --language zh | tee build/zh/checks.json
          python scripts/qa_manuscripts.py --language en | tee build/en/checks.json

      - name: Upload checked PDFs
        id: pdf
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manuscript-pdfs-${{ github.sha }}
          path: |
            build/zh/main_zh.pdf
            build/zh/supplementary_zh.pdf
            build/zh/checks.json
            build/en/main_en.pdf
            build/en/supplementary_en.pdf
            build/en/checks.json
          if-no-files-found: error
          retention-days: 30

      - name: Add PDF download to run summary
        env:
          PDF_ARTIFACT_URL: ${{ steps.pdf.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          zh = json.loads(Path('build/zh/checks.json').read_text())
          en = json.loads(Path('build/en/checks.json').read_text())
          sd = en.get('scientific_data_limits', {})
          zh_si = zh.get('supplementary_information', {})
          en_si = en.get('supplementary_information', {})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Bilingual Data Descriptor PDFs\n\n')
              summary.write(f"[Download the checked PDFs]({os.environ['PDF_ARTIFACT_URL']})\n\n")
              summary.write(f"- **Chinese (`main_zh.pdf` + `supplementary_zh.pdf`):** {zh['pages']} + {zh_si.get('pages')} pages; 0 log/box issues.\n")
              summary.write(f"- **English (`main_en.pdf` + `supplementary_en.pdf`):** {en['pages']} + {en_si.get('pages')} pages; title {sd.get('title_chars')} chars (<=110); abstract {sd.get('abstract_words')} words (<=170).\n")
          PY

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manuscript-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/zh/*.log
            build/zh/*.blg
            build/zh/checks.json
            build/en/*.log
            build/en/*.blg
            build/en/checks.json
          if-no-files-found: ignore
          retention-days: 14
